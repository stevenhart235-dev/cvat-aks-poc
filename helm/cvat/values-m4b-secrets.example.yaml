# Copy to values-m4b-secrets.local.yaml and replace every placeholder locally.
# The local file is ignored by Git and must be passed to Helm after values-m4a-poc.yaml.

postgresql:
  secret:
    password: REPLACE_WITH_RANDOM_CVAT_DATABASE_PASSWORD
    postgres_password: REPLACE_WITH_RANDOM_POSTGRES_ADMIN_PASSWORD
    replication_password: REPLACE_WITH_RANDOM_POSTGRES_REPLICATION_PASSWORD
  # The CVAT chart has no top-level extra-object hook. Its packaged PostgreSQL
  # dependency supports extraDeploy, which keeps this local Secret in the same
  # Helm render/release without modifying the approved chart artifact.
  extraDeploy:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: cvat-django-secret
        namespace: '{{ .Release.Namespace }}'
      type: Opaque
      stringData:
        django-secret-key: REPLACE_WITH_RANDOM_DJANGO_SECRET_KEY

redis:
  secret:
    password: REPLACE_WITH_RANDOM_REDIS_PASSWORD

cvat:
  kvrocks:
    secret:
      password: REPLACE_WITH_RANDOM_KVROCKS_PASSWORD

analytics:
  clickhousePassword: REPLACE_WITH_RANDOM_CLICKHOUSE_PASSWORD

grafana:
  adminPassword: REPLACE_WITH_RANDOM_GRAFANA_ADMIN_PASSWORD
